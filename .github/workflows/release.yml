name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 0.1.0)'
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            name: macOS-ARM64
          - platform: macos-latest
            target: x86_64-apple-darwin
            name: macOS-Intel
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            name: Windows

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install frontend dependencies
        run: bun install

      # macOS: Install Apple Silicon target if building for ARM64 on Intel runner
      - name: Add macOS ARM64 target
        if: matrix.target == 'aarch64-apple-darwin'
        run: rustup target add aarch64-apple-darwin

      # Download and setup external binaries for the target platform
      - name: Setup external binaries (macOS ARM64)
        if: matrix.target == 'aarch64-apple-darwin'
        run: |
          # Verify binaries exist and are executable
          chmod +x src-tauri/binaries/scrcpy-aarch64-apple-darwin
          chmod +x src-tauri/binaries/adb-aarch64-apple-darwin

      - name: Setup external binaries (macOS Intel)
        if: matrix.target == 'x86_64-apple-darwin'
        run: |
          chmod +x src-tauri/binaries/*-x86_64-apple-darwin

      - name: Setup external binaries (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          # Verify Windows binaries and DLLs exist
          $required = @(
            "scrcpy-x86_64-pc-windows-msvc.exe",
            "adb-x86_64-pc-windows-msvc.exe",
            "SDL2.dll",
            "avcodec-61.dll",
            "avformat-61.dll",
            "avutil-59.dll",
            "swresample-5.dll",
            "AdbWinApi.dll",
            "AdbWinUsbApi.dll",
            "libusb-1.0.dll"
          )
          foreach ($file in $required) {
            if (-not (Test-Path "src-tauri/binaries/$file")) {
              Write-Error "$file not found in src-tauri/binaries/"
              exit 1
            }
          }
          Write-Host "All Windows binaries verified"

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Default to ad-hoc signing so Apple Silicon downloads are a valid
          # macOS app bundle even when CI does not have Apple signing secrets.
          # Override this with a real Developer ID identity secret when ready.
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY != '' && secrets.APPLE_SIGNING_IDENTITY || '-' }}
          # For notarized builds, add these secrets to your repository:
          # APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
          # APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID (macOS)
          # TAURI_SIGNING_PRIVATE_KEY, TAURI_SIGNING_PRIVATE_KEY_PASSWORD (Windows)
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'EasyScrcpy ${{ github.ref_name }}'
          releaseBody: |
            See the assets below to download and install EasyScrcpy for your platform.

            ## Installation
            - **macOS ARM64 (M1/M2/M3):** Download the `.dmg` file
            - **macOS Intel:** Download the `_x64.dmg` file
            - **Windows:** Download the `.msi` or `.exe` installer

            ## Requirements
            - Android device with USB debugging enabled
            - USB cable connected to your computer
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }}

      - name: Verify macOS app bundle signature
        if: matrix.platform == 'macos-latest'
        run: |
          bash scripts/verify-macos-bundle.sh \
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/EasyScrcpy.app

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: EasyScrcpy-${{ matrix.name }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
          if-no-files-found: ignore
