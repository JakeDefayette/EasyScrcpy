[package]
name = "easyscrcpy"
version = "0.1.2"
description = "Cross-platform GUI for Android screen mirroring with scrcpy"
authors = ["SimVS"]
edition = "2021"

[lib]
name = "easyscrcpy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time"] }
dirs = "6"
